<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>摇一下 · 大转盘</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
    :root { --ink:#171717; --muted:#77756e; --paper:#f7f5ef; --line:#dedbd2; --accent:#e85d3f; --yellow:#f1bf45; --blue:#79a9a1; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans SC',system-ui,sans-serif; }
    .shell { max-width:1180px; margin:auto; padding:28px 28px 52px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:20px; }
    .eyebrow { font:500 11px 'DM Mono',monospace; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
    h1 { font-size:clamp(30px,4vw,46px); letter-spacing:-.055em; line-height:1; margin:0; font-weight:800; }
    .tagline { color:var(--muted); font-size:13px; margin:0 0 3px; }
    main { display:grid; grid-template-columns:320px 1fr; gap:58px; padding-top:48px; align-items:center; }
    .panel { align-self:stretch; display:flex; flex-direction:column; }
    .label-row { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
    .label { font-size:14px; font-weight:700; }
    .count { color:var(--muted); font:12px 'DM Mono',monospace; }
    textarea { width:100%; min-height:310px; resize:vertical; border:1px solid var(--line); border-radius:10px; padding:16px; background:#fffdf8; color:var(--ink); font:15px/1.85 'Noto Sans SC',sans-serif; outline:none; transition:.2s; }
    textarea:focus { border-color:var(--ink); box-shadow:0 0 0 3px rgba(23,23,23,.06); }
    .hint { margin:11px 0 24px; color:var(--muted); font-size:12px; line-height:1.7; }
    button { border:0; cursor:pointer; font:700 14px 'Noto Sans SC',sans-serif; transition:transform .15s, box-shadow .15s, background .15s; }
    button:active { transform:translateY(1px) scale(.99); }
    .primary { background:var(--ink); color:white; border-radius:999px; padding:15px 22px; width:100%; box-shadow:0 6px 0 #d7d3c8; }
    .primary:hover { background:#343434; box-shadow:0 4px 0 #d7d3c8; transform:translateY(2px); }
    .secondary { display:block; margin:16px auto 0; background:transparent; color:var(--muted); font-size:12px; text-decoration:underline; text-underline-offset:3px; }
    .wheel-stage { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .wheel-wrap { position:relative; width:min(64vw,570px); aspect-ratio:1; }
    canvas { width:100%; height:100%; display:block; filter:drop-shadow(0 18px 17px rgba(34,28,19,.12)); }
    .pin { position:absolute; z-index:2; top:-11px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:14px solid transparent; border-right:14px solid transparent; border-top:32px solid var(--accent); filter:drop-shadow(0 3px 0 rgba(180,52,32,.2)); }
    .hub { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:89px; height:89px; border-radius:50%; background:var(--ink); border:8px solid var(--paper); display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; letter-spacing:.08em; box-shadow:0 0 0 1px var(--ink); }
    .result { min-height:45px; margin-top:28px; text-align:center; }
    .result small { color:var(--muted); font-size:11px; letter-spacing:.12em; }
    .result strong { display:block; margin-top:6px; font-size:26px; letter-spacing:-.04em; }
    footer { margin-top:58px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font:11px 'DM Mono',monospace; display:flex; justify-content:space-between; }
    @media (max-width:760px) {
      .shell { padding:20px 18px 34px; } header { display:block; } .tagline { margin-top:12px; }
      main { display:flex; flex-direction:column-reverse; gap:28px; padding-top:30px; align-items:stretch; }
      .wheel-wrap { width:min(88vw,390px); margin:auto; } .hub { width:74px; height:74px; font-size:10px; border-width:6px; }
      .panel { align-self:auto; } textarea { min-height:180px; } footer { margin-top:35px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header><div><div class="eyebrow">A fair little decision machine</div><h1>摇一下 · 大转盘</h1></div><p class="tagline">每一格机会相等，交给运气就好。</p></header>
    <main>
      <section class="panel" aria-label="编辑选项">
        <div class="label-row"><span class="label">转盘内容</span><span class="count" id="count">4 ITEMS</span></div>
        <textarea id="items" aria-label="转盘选项，每行一个">喝杯咖啡
散步 20 分钟
看一集剧
整理桌面</textarea>
        <p class="hint">每行输入一个选项。支持 2–12 项，所有扇区自动均分。</p>
        <button class="primary" id="spinBtn">摇一下 <span>↗</span></button>
        <button class="secondary" id="shareBtn">分享这个转盘</button>
      </section>
      <section class="wheel-stage" aria-live="polite">
        <div class="wheel-wrap"><div class="pin"></div><canvas id="wheel" width="900" height="900"></canvas><div class="hub">摇一下</div></div>
        <div class="result" id="result"><small>READY WHEN YOU ARE</small><strong>转盘已经准备好</strong></div>
      </section>
    </main>
    <footer><span>NO WEIGHTS · JUST LUCK</span><span id="date"></span></footer>
  </div>
  <script>
    const canvas=document.getElementById('wheel'), ctx=canvas.getContext('2d'), input=document.getElementById('items'), count=document.getElementById('count'), btn=document.getElementById('spinBtn'), result=document.getElementById('result');
    const colors=['#e85d3f','#f1bf45','#79a9a1','#d98a6a','#8d9fc4','#e7a4a1','#b2bc70','#e5caa2','#8ab4b7','#c67d62','#a89bc5','#e0a93a'];
    let rotation=0, busy=false;
    const getItems=()=>input.value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,12);
    function draw(){ const items=getItems(); count.textContent=items.length+' ITEMS'; const n=Math.max(items.length,2), r=450, c=450, step=Math.PI*2/n; ctx.clearRect(0,0,900,900); ctx.save(); ctx.translate(c,c); ctx.rotate(rotation*Math.PI/180); for(let i=0;i<n;i++){ const a=-Math.PI/2+i*step; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r-9,a,a+step); ctx.closePath(); ctx.fillStyle=colors[i%colors.length]; ctx.fill(); ctx.strokeStyle='#f7f5ef'; ctx.lineWidth=8; ctx.stroke(); if(i<items.length){ ctx.save(); ctx.rotate(a+step/2); ctx.translate(r*.64,0); ctx.rotate(Math.PI/2); ctx.fillStyle='#171717'; ctx.textAlign='center'; ctx.textBaseline='middle'; let text=items[i]; if(text.length>8) text=text.slice(0,8)+'…'; ctx.font='700 '+Math.max(17,Math.min(28,220/n))+'px Noto Sans SC'; ctx.fillText(text,0,0); ctx.restore(); } } ctx.restore(); }
    function updateFromUrl(){ const p=new URLSearchParams(location.search).get('items'); if(p) input.value=p.split('|').join('\n'); draw(); }
    input.addEventListener('input',draw); updateFromUrl(); document.getElementById('date').textContent=new Date().getFullYear()+' / MOBILE READY';
    btn.addEventListener('click',()=>{ const items=getItems(); if(busy)return; if(items.length<2){ result.innerHTML='<small>ADD ONE MORE</small><strong>至少需要 2 个选项</strong>'; return; } busy=true; btn.textContent='转盘转动中…'; const n=items.length, winner=Math.floor(Math.random()*n), step=360/n; const target=360*5+(360-(winner+.5)*step)-rotation%360; const start=rotation; const t0=performance.now(); function animate(t){ const p=Math.min(1,(t-t0)/3700), eased=1-Math.pow(1-p,3); rotation=start+target*eased; draw(); if(p<1)requestAnimationFrame(animate); else { busy=false; btn.innerHTML='摇一下 <span>↗</span>'; result.innerHTML='<small>THE RESULT IS</small><strong>'+items[winner]+'</strong>'; } } requestAnimationFrame(animate); });
    document.getElementById('shareBtn').addEventListener('click',async()=>{ const items=getItems(); const url=location.href.split('?')[0]+'?items='+encodeURIComponent(items.join('|')); try{ await navigator.clipboard.writeText(url); result.innerHTML='<small>LINK COPIED</small><strong>分享链接已复制</strong>'; }catch(e){ prompt('复制这个链接分享给朋友：',url); } });
  </script>
</body>
</html>
